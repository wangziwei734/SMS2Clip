[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sms2clip"
version = "0.4.0"
description = "Forward iPhone SMS through ntfy and copy verification codes to the Windows clipboard"
requires-python = ">=3.10"
dependencies = ["pystray>=0.19.5", "Pillow>=10,<13", "qrcode>=7.4", "windows-toasts>=1.3.1", "pywin32>=306; sys_platform == 'win32'"]

[project.scripts]
sms2clip = "SMS2Clip.__main__:main"
sms2clip-gui = "SMS2Clip.entry:main"

[tool.setuptools]
packages = ["SMS2Clip"]
