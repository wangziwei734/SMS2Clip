[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ntfy-clipboard"
version = "0.3.0"
description = "Forward iPhone SMS through ntfy and copy verification codes to the Windows clipboard"
requires-python = ">=3.10"
dependencies = ["pystray>=0.19.5", "Pillow>=10,<13", "qrcode>=7.4", "windows-toasts>=1.3.1"]

[project.scripts]
ntfy-clipboard = "ntfy_clipboard.__main__:main"
ntfy-clipboard-gui = "ntfy_clipboard.entry:main"

[tool.setuptools]
packages = ["ntfy_clipboard"]
